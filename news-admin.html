<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>お知らせ管理 | WIZ株式会社</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f4;color:#353437;font:16px/1.7 system-ui,sans-serif}main{max-width:650px;margin:auto;padding:48px 22px 80px}h1,h2{font-family:serif;font-weight:500}h1{margin:20px 0 32px}label{display:block;font-weight:600;margin-top:22px}textarea,input,select{width:100%;padding:12px;border:1px solid #bbb;background:white;border-radius:4px;font:inherit}img{width:min(100%,360px);aspect-ratio:55/32;object-fit:cover}button{padding:12px 22px;background:#36323b;color:white;border:0;border-radius:4px;font:inherit;cursor:pointer}a{color:#4d4160;text-underline-offset:4px}output{display:block;overflow-wrap:anywhere}p{margin:12px 0}small{font-weight:400}
textarea{resize:vertical}#body-preview{white-space:pre-wrap;overflow-wrap:anywhere}#delete-post{background:white;display:inline-block;padding:8px 16px;border:1px solid #995858;border-radius:4px;color:#873f3f;text-decoration:none}#delete-row{margin-top:32px}</style></head><body><main><a href="/#news">← 公開中のお知らせ</a><h1>お知らせ管理</h1>
<form id="login">
<div id="setup"><p>このブラウザで使う管理用パスワードを12文字以上で設定します。GitHubとの接続は初回のみです。</p>
<label for="access">サイト専用のGitHubトークン</label><input id="access" type="password" autocomplete="off" spellcheck="false">
<small><a href="https://github.com/settings/personal-access-tokens/new?name=WIZ%20News&amp;target_name=motomocards&amp;contents=write" target="_blank" rel="noopener">トークンを作成</a>し、対象を wiz-kk-website のみに、Contents を Read and write に設定してください。</small></div>
<label for="password">管理用パスワード</label><input id="password" type="password" required autocomplete="current-password">
<p><button id="enter">ログイン</button></p><button id="reconnect" type="button" hidden>接続を再設定</button><p id="auth-status" role="status"></p></form>
<section id="panel" hidden><button id="logout" type="button">ログアウト</button>
<label for="posts">編集するお知らせ</label><select id="posts"><option value="">新規投稿</option></select><p id="list-status" role="status"></p>
<form id="editor"><label for="headline">タイトル</label><input id="headline" required maxlength="140">
<label for="body-text">本文</label><textarea id="body-text" rows="7" placeholder="本文にURLを書くとリンクになります"></textarea>
<label for="photo">サムネイル画像1枚 <small>（任意）</small></label><input id="photo" type="file" accept="image/*">
<button type="button" id="reset-image">標準画像に戻す</button><label for="target">リンク先 <small>（任意）</small></label><input id="target" type="text" inputmode="url" placeholder="https://">
<h2>プレビュー</h2><img id="preview" src="/news-default.svg" alt=""><output id="caption"></output><div id="body-preview"></div>
<button id="save">公開する</button><p role="status" id="status"></p></form>
<p id="delete-row" hidden><button type="button" id="delete-post">投稿を削除</button></p></section></main>
<script src="/news-text.js"></script>
<script>
const field = id => document.getElementById(id);
const form = field('editor'), photo = field('photo'), preview = field('preview');
const defaultImage = preview.getAttribute('src');
const picker = field('posts'), entries = new Map(), versions = new Map();
let revision = 0, encoded = '', filename = '', originalImage = defaultImage, token = '';
picker.onchange = () => {
  revision++; form.reset(); encoded = ''; filename = '';
  const item = entries.get(picker.value);
  field('delete-row').hidden = !item;
  originalImage = item?.image || defaultImage; preview.src = originalImage;
  field('headline').value = item?.title || ''; field('target').value = item?.url || '';
  field('body-text').value = item?.body || '';
  renderNewsBody(field('body-preview'),field('body-text').value);
  field('caption').textContent = field('headline').value;
  field('status').textContent = '';
  field('save').textContent = item ? '更新する' : '公開する';
};
field('reset-image').onclick = () => {
  revision++; photo.value = ''; encoded = ''; originalImage = defaultImage; preview.src = defaultImage;
  form.oninput();
};
form.oninput = () => { renderNewsBody(field('body-preview'),field('body-text').value);  field('status').textContent = ''; field('caption').textContent = field('headline').value; };
photo.onchange = async () => {
  const n = ++revision;
  encoded = ''; preview.src = originalImage;
  if (!photo.files.length) return;
  const address = URL.createObjectURL(photo.files[0]);
  try {
    const image = new Image(); image.src = address; await image.decode();
    if (n !== revision) return;
    const canvas = document.createElement('canvas');
    const scale = Math.min(1, 1100 / Math.max(image.width,image.height));
    canvas.width = Math.max(1,Math.round(image.width*scale)); canvas.height = Math.max(1,Math.round(image.height*scale));
    const ctx = canvas.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.drawImage(image,0,0,canvas.width,canvas.height);
    encoded = canvas.toDataURL('image/jpeg',0.82); preview.src = encoded; preview.hidden = false;
  } catch { if (n === revision) field('status').textContent = '画像を読み込めません。JPEGまたはPNGでお試しください。'; }
  finally { URL.revokeObjectURL(address); }
};
form.onsubmit = async event => {
  event.preventDefault();
  const title = field('headline').value.trim(), url = field('target').value.trim();
  if (!title || (photo.files.length && !encoded) || (url && !/^(https?:\/\/|\/(?!\/)|#)/i.test(url))) {field('status').textContent = 'タイトルと画像を確認してください。リンク先にはサイト内のパス、ページ内リンク、またはWebサイトのURLを指定してください。'; return;}
  filename ||= '/wiz-post-entry-'+new Date().toISOString().replace(/\D/g,'')+'-'+crypto.randomUUID()+'.json';
  const path = picker.value || filename;
  await writePost(path,{...entries.get(path),title,body:field('body-text').value,image:encoded || originalImage,url});
};
</script><script src="/news-login.js?v=1"></script></body></html>
